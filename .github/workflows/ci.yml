name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# spec fixtures の pin。test job と coverage job が同じ tree を読むので、bump はここ 1 箇所。
env:
  KUU_SPEC_REF: 3e0467c804df37f6d249333862aa9fa9f9242372

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 公式 install script で rolling nightly を直取得 (moonup の nightly index は
      # 1 日遅延することがあり、toolchain 移行日 (例: assert_eq の Show→Debug) に
      # ローカルと CI で版が割れるため。CDN の binaries/nightly は当日更新される)
      - run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn
      - name: Check public interface drift
        run: |
          moon info src/abi src/extension src/internal/engine src/kuu-node src/builtins src/kuu
          git diff --exit-code -- src/abi/pkg.generated.mbti src/extension/pkg.generated.mbti src/internal/engine/pkg.generated.mbti src/kuu-node/pkg.generated.mbti src/builtins/pkg.generated.mbti src/kuu/pkg.generated.mbti

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        target: [wasm-gc, native]
    steps:
      - uses: actions/checkout@v7

      # conformance fixtures の正本 (kawaz/kuu) を SHA-pin で並置 checkout。
      # 追従は本 ref を bump する PR で明示化する (MDR-001 §5)。
      - name: Checkout kuu spec fixtures (SHA-pinned)
        uses: actions/checkout@v7
        with:
          repository: kawaz/kuu
          ref: ${{ env.KUU_SPEC_REF }}
          path: _kuu-spec

      # 公式 install script で rolling nightly を直取得 (moonup の nightly index は
      # 1 日遅延することがあり、toolchain 移行日 (例: assert_eq の Show→Debug) に
      # ローカルと CI で版が割れるため。CDN の binaries/nightly は当日更新される)
      - run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update

      - name: Run tests
        env:
          TARGET: ${{ matrix.target }}
          KUU_FIXTURES: ${{ github.workspace }}/_kuu-spec/fixtures
        run: moon test --target "$TARGET"

  # 見逃しの可視化が目的であって enforcement ではないので、**閾値 gate は置かない**。
  # 落ちるのはテスト自体が落ちたときだけ。数字はジョブログの summary で、未到達の行は
  # artifact の HTML で読む。ローカルの同等手順は `just coverage` / `just coverage-html`
  # (CI では just を入れずに moon を直に叩く — lint / test ジョブと同じ流儀)。
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      # conformance runner が fixtures を live 参照するので、test job と同じ SHA-pin で
      # spec を並置 checkout する。
      - name: Checkout kuu spec fixtures (SHA-pinned)
        uses: actions/checkout@v7
        with:
          repository: kawaz/kuu
          ref: ${{ env.KUU_SPEC_REF }}
          path: _kuu-spec

      - run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update

      # 前回の trace が残っていると集計に混ざるので必ず落とす (`just coverage` と同じ)。
      - run: moon coverage clean

      - name: Run tests with coverage instrumentation
        env:
          KUU_FIXTURES: ${{ github.workspace }}/_kuu-spec/fixtures
        run: moon test --target native --enable-coverage

      - name: Coverage summary
        run: moon coverage report -f summary

      - name: Build HTML report
        run: moon coverage report -f html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: _coverage/
